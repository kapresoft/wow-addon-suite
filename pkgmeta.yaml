package-as: AddonSuite
# --------------------------

manual-changelog:
  filename: dev/changelog-release.md
  markup-type: markdown

embedded-libraries:
  - LibStub
  - LibTraceKit
  - Ace3
  - LibUtil
  - LibPrettyPrint

tools-used:
  - DevSuite
  - DebugChatFrame
  - Bugsack
  - Bug-Grabber

externals:
  AddonSuite/ThirdParty/Libs/LibPrettyPrint:
    url: https://github.com/kapresoft/wow-addon-LibPrettyPrint
    tag: latest
  AddonSuite/ThirdParty/Libs/LibTraceKit:
    url: https://github.com/kapresoft/wow-addon-LibTraceKit
    tag: latest
  AddonSuite/ThirdParty/Libs/Ace3:
    url: https://github.com/WoWUIDev/Ace3
    tag: latest
  AddonSuite/ThirdParty/Libs/LibDBIcon/LibDBIcon-1.0:
    url: https://repos.wowace.com/wow/libdbicon-1-0/trunk
    tag: latest
  AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil:
    url: https://github.com/kapresoft/wow-lib-util
    tag: latest

ignore:
  - "*.sh"
  - "*.md"
  - "*.yaml"
  - "*.yml"
  - "*.toml"
  - dev
  - doc
  - scripts
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/*.toc
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/dev
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-1-0
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Assets
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/ThirdParty
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.lua
  - AddonSuite/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.xml
  - AddonSuite/ThirdParty/Libs/Ace3/Ace3.lua
  - AddonSuite/ThirdParty/Libs/Ace3/Bindings.xml
  - AddonSuite/ThirdParty/Libs/Ace3/changelog.txt
  - AddonSuite/ThirdParty/Libs/Ace3/LICENSE.txt
  - AddonSuite/ThirdParty/Libs/Ace3/*.toc
  - AddonSuite/ThirdParty/Libs/LibDBIcon/LibDBIcon-1.0/embeds.xml
  - AddonSuite/ThirdParty/Libs/LibDBIcon/LibDBIcon-1.0/LibDBIcon-1.0/lib.xml
  - AddonSuite/ThirdParty/Libs/LibDBIcon/LibDBIcon-1.0/CallbackHandler-1.0
  - AddonSuite/ThirdParty/Libs/LibDBIcon/LibDBIcon-1.0/LibStub
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/LICENSE
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/*.toc
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/dev
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/doc
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/Assets
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/ThirdParty
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/LibPrettyPrint.xml
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/Libs/Developer/*.xml
  - AddonSuite/ThirdParty/Libs/LibPrettyPrint/Libs/Developer/Developer*.lua
  - AddonSuite/ThirdParty/Libs/LibTraceKit/*.toc
  - AddonSuite/ThirdParty/Libs/LibTraceKit/dev
  - AddonSuite/ThirdParty/Libs/LibTraceKit/doc
  - AddonSuite/ThirdParty/Libs/LibTraceKit/ThirdParty
  - AddonSuite/ThirdParty/Libs/LibTraceKit/Libs/Assets
  - AddonSuite/ThirdParty/Libs/LibTraceKit/Libs/Developer.lua

# REQUIRED for CurseForge packager (non-obvious):
# The LEFT side MUST be <repo-folder>/<addon-folder>
#   - <addon-folder> MUST be the folder that contains the .toc files
# The RIGHT side MUST be the addon name:
#   - Must match the .toc filename (AddonName.toc)
#   - Must match `package-as`
#
# NOTE:
# CurseForge release.sh (poorly) relies on `move-folders` for *addon discovery*,
# not just post-processing. If this does not exactly match
# <repo>/<addon>, `toc_root_paths` will be empty and packaging WILL fail.
#
# ⚠️ Do not change unless you also change the repo/addon layout.
move-folders:
  AddonSuite/AddonSuite: AddonSuite
  